name: Latch regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: latch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  handler-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=low
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/ci-handler.mjs
      - run: node scripts/ci-handler.mjs --native
      - run: pnpm exec vite build examples/catalog
      - run: pnpm exec vite build examples/docs
      - id: package
        run: node scripts/pack.mjs
      - run: node scripts/audit-artifacts.mjs
      - run: pnpm verify:consumer ../latch-clean-consumer --chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: latch-packages
          overwrite: true
          path: |
            artifacts/latch-local-*-${{ steps.package.outputs.version }}.tgz
            artifacts/latch-local-*-${{ steps.package.outputs.version }}.tgz.sha256
            artifacts/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: latch-reports-${{ matrix.os }}
          overwrite: true
          path: reports/
  publish:
    needs: handler-and-unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: latch-packages
          path: release-artifacts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const publish = require('./scripts/release.cjs');
            await publish({ github, context, core });
