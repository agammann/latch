name: Latch regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  handler-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=low
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/ci-handler.mjs
      - run: node scripts/ci-handler.mjs --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latch-reports-${{ matrix.os }}
          path: reports/
